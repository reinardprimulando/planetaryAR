<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Real-Time Solar System</title>
    
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
    
    <!-- FIX 1: Switched to the FULL AR.js build to guarantee webcam initialization -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <!-- Astronomy Engine -->
    <script src="https://unpkg.com/astronomy-engine@2.1.19/astronomy.browser.js"></script>

    <style>
        /* Force transparent backgrounds to ensure video feed passes through */
        body, html { 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            font-family: sans-serif; 
            background-color: transparent !important;
        }
        
        #ui-container {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 9999;
        }

        #place-btn {
            background-color: #ff9800;
            color: #fff;
            border: none;
            padding: 18px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: background 0.3s;
        }

        #place-btn:active { background-color: #e68a00; }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            z-index: 9999;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="info-panel">
        <strong>Real-Time Scaled AR Solar System</strong><br>
        <small>Sun size: 0.21m (Volleyball)</small>
    </div>

    <div id="ui-container">
        <button id="place-btn">Place Sun Near Me</button>
    </div>

    <!-- Added clearColor: transparent to ensure the canvas doesn't render a white wall -->
    <a-scene vr-mode-ui="enabled: false" arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;" renderer="antialias: true; alpha: true; clearColor: transparent;">
        <a-camera gps-new-camera="gpsMinDistance: 1;"></a-camera>
    </a-scene>

    <script>
        // Constants & Scale Math
        const REAL_SUN_DIAMETER_M = 1392700000;
        const TARGET_SUN_DIAMETER_M = 0.21;
        const SCALE_FACTOR = TARGET_SUN_DIAMETER_M / REAL_SUN_DIAMETER_M;
        const AU_IN_METERS = 149597870700;
        const SCALED_AU_M = AU_IN_METERS * SCALE_FACTOR;
        const METERS_PER_DEG_LAT = 111320;

        // Planetary Data
        const planets = [
            { name: 'Mercury', body: 'Mercury', diameter: 4880000, color: '#a8a8a8' },
            { name: 'Venus',   body: 'Venus',   diameter: 12104000, color: '#e0ce8d' },
            { name: 'Earth',   body: 'Earth',   diameter: 12742000, color: '#2b82c9' },
            { name: 'Mars',    body: 'Mars',    diameter: 6779000, color: '#c1440e' },
            { name: 'Jupiter', body: 'Jupiter', diameter: 139820000, color: '#d39c7e' },
            { name: 'Saturn',  body: 'Saturn',  diameter: 116460000, color: '#c5ab6e' },
            { name: 'Uranus',  body: 'Uranus',  diameter: 50724000, color: '#4b70dd' },
            { name: 'Neptune', body: 'Neptune', diameter: 49244000, color: '#274687' }
        ];

        const placeBtn = document.getElementById('place-btn');
        const scene = document.querySelector('a-scene');

        placeBtn.addEventListener('click', async () => {
            placeBtn.innerText = "Acquiring GPS...";
            placeBtn.disabled = true;

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    placeBtn.style.display = 'none';
                    buildSolarSystem(position);
                },
                (error) => {
                    alert(`GPS Error: ${error.message}`);
                    placeBtn.innerText = "Place Sun Near Me";
                    placeBtn.disabled = false;
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
            );
        });

        function buildSolarSystem(position) {
            // FIX 2: Offset the Sun 4 meters NORTH of the user so you aren't standing inside it.
            const sunLat = position.coords.latitude + (4 / METERS_PER_DEG_LAT);
            const sunLon = position.coords.longitude;

            document.getElementById('info-panel').innerHTML += `<br><small>Sun placed 4 meters in front of you!</small>`;

            const sunEntity = document.createElement('a-entity');
            sunEntity.setAttribute('gps-new-entity-place', `latitude: ${sunLat}; longitude: ${sunLon}`);
            
            const sunSphere = document.createElement('a-sphere');
            sunSphere.setAttribute('radius', (TARGET_SUN_DIAMETER_M / 2).toFixed(4));
            sunSphere.setAttribute('material', 'color: #ffcc00; emissive: #ffaa00; emissiveIntensity: 0.5');
            sunEntity.appendChild(sunSphere);
            scene.appendChild(sunEntity);

            const astroTime = new Astronomy.AstroTime(new Date());

            planets.forEach(planet => {
                const vec = Astronomy.HelioVector(Astronomy.Body[planet.body], astroTime);
                
                const x_meters = vec.x * SCALED_AU_M;
                const y_meters = vec.y * SCALED_AU_M;
                const z_meters = vec.z * SCALED_AU_M;
                
                const r_meters = Math.sqrt(x_meters**2 + y_meters**2 + z_meters**2);

                const latOffset = y_meters / METERS_PER_DEG_LAT;
                const lonOffset = x_meters / (METERS_PER_DEG_LAT * Math.cos(sunLat * (Math.PI / 180)));

                const pEntity = document.createElement('a-entity');
                pEntity.setAttribute('gps-new-entity-place', `latitude: ${sunLat + latOffset}; longitude: ${sunLon + lonOffset}`);

                const scaledRadius = (planet.diameter * SCALE_FACTOR) / 2;
                const core = document.createElement('a-sphere');
                core.setAttribute('radius', scaledRadius.toFixed(6));
                core.setAttribute('color', planet.color);

                const haloRadius = Math.max(0.25, r_meters / 35); 
                const halo = document.createElement('a-sphere');
                halo.setAttribute('radius', haloRadius.toFixed(3));
                halo.setAttribute('material', `color: ${planet.color}; opacity: 0.4; transparent: true; blending: additive; side: back`);

                // FIX 3: Strictly cap the maximum scale of the text so it doesn't blow out the screen
                const textScale = Math.min(Math.max(1, r_meters / 20), 8);
                const text = document.createElement('a-text');
                text.setAttribute('value', planet.name);
                text.setAttribute('align', 'center');
                text.setAttribute('color', '#ffffff');
                text.setAttribute('scale', `${textScale} ${textScale} ${textScale}`);
                text.setAttribute('position', `0 ${haloRadius + (textScale * 0.15)} 0`);
                text.setAttribute('look-at', '[gps-new-camera]');

                pEntity.appendChild(core);
                pEntity.appendChild(halo);
                pEntity.appendChild(text);
                scene.appendChild(pEntity);

                // FIX 4: Thinner orbit rings to reduce visual clutter
                const orbitRing = document.createElement('a-torus');
                orbitRing.setAttribute('radius', r_meters.toFixed(3));
                orbitRing.setAttribute('radius-tubular', '0.005');
                orbitRing.setAttribute('rotation', '90 0 0'); 
                orbitRing.setAttribute('material', `color: ${planet.color}; opacity: 0.3; transparent: true; shader: flat;`);
                
                sunEntity.appendChild(orbitRing);
            });
        }
    </script>
</body>
</html>
